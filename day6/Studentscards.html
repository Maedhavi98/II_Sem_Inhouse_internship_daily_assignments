
            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="bg-light">

    <div class="container py-5">
        <h2 class="text-center mb-4">Student Records</h2>

        <input type="text" id="search" class="form-control mb-4" placeholder="Search Student">

        <div id="container" class="row g-4"></div>
        <div id="JSON"></div>        
    </div>

    <script>
        const students = [
            { name: "Aadita", branch: "Computer Science", cgpa:8.4},
            { name: "Maedhavi", branch: "Computer Science", cgpa:8.6},
            { name: "Simran", branch: "Computer Science", cgpa:8.2},
            { name: "Aanyaa", branch: "Computer Science", cgpa:8.8},
            { name: "Eshita", branch: "Computer Science", cgpa:8.6},
            { name: "Aarambh", branch: "Computer Science", cgpa:8.9},
            { name: "Ritik", branch: "Computer Science", cgpa:9.0},
            { name: "Himanshu", branch: "Computer Science", cgpa:6.8},
            { name: "Isha", branch: "Computer Science", cgpa:7.5},
            { name: "Jatin", branch: "Computer Science", cgpa:9.0}  
            
        ];

        let html = "";

        for (let i = 0; i < students.length; i++) {
            html += `
                <div class="col-md-4 card-item">
                    <div class="card shadow">
                        <div class="card-body">
                            <h4>${students[i].name}</h4>

                            <button class="btn btn-primary btn-sm mt-2">
                                Show Details
                            </button>

                            <div class="details mt-3" style="display:none;">
                                <p><strong>Branch:</strong> ${students[i].branch}</p>
                                <p><strong>CGPA:</strong> ${students[i].cgpa}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        document.getElementById("container").innerHTML = html;

        // Show/Hide Details
        $(document).on("click", ".btn", function () {
            $(this).next(".details").toggle();
        });

        // Search Student
        $("#search").on("keyup", function () {
            let value = $(this).val().toLowerCase();

            $(".card-item").filter(function () {
                $(this).toggle(
                    $(this).text().toLowerCase().indexOf(value) > -1
                );
            });
        });
        document.getElementById("JSON").innerHTML = JSON.stringify(students, replacer, 4);
        //3.replacer (function)
        function replacer(key, value) {
            if (key === "cgpa") {
                return undefined; // Exclude CGPA values
            }
            return value; // Include other values
        }
    </script>

</body>
</html>
